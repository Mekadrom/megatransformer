[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megatransformer"
version = "0.1.0"
description = "Multimodal transformer research models (SIVE, SMG, vocoder, world model)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Core, INTENTIONALLY UNPINNED library deps: everything a downstream consumer
# (e.g. the ComfyUI SIVE/ContentVec->SMG inference nodes) needs to `import
# megatransformer` and run inference. The torch FAMILY (torch/torchaudio/
# torchvision) is deliberately kept OUT of here so a plain `pip install
# megatransformer` never clobbers a host env's existing CUDA torch — the
# training node gets torch via the uv `training` dependency-group instead.
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
    "matplotlib",
    "transformers",
    "huggingface-hub",
    "safetensors",
    "librosa",
    "soundfile",   # direct audio decode in the voice preprocessor (datasets 5.x Audio decode
    "soxr",        # needs torchcodec, which is ABI-incompatible with our torch 2.6 wheel)
    "speechbrain",
    "torchcrepe",
    "pyctcdecode",
    "sentencepiece",   # required by the Mistral tokenizer (not auto-installed by transformers)
    "protobuf",        # ditto (tokenizer conversion)
    "rotary-embedding-torch",
]

[project.optional-dependencies]
# ── ACCELERATOR SELECTION ────────────────────────────────────────────────────
# The torch family cannot be avoided by omitting it from [dependencies]: speechbrain,
# torchcrepe and rotary-embedding-torch all require torch UNCONDITIONALLY, so uv must
# resolve it even with --no-default-groups. Which WHEEL it resolves is decided by
# [tool.uv.sources] below, keyed on which of these extras is selected.
#   uv sync --extra cu124   -> CUDA 12.4 build (the training boxes; default via `training`)
#   uv sync --extra rocm    -> ROCm build (inference-only boxes; no nvidia-* wheels)
#   uv sync --extra cpu     -> CPU-only build
# Exactly one may be selected; they are declared conflicting in [tool.uv].
# Floors matter: unconstrained, the ROCm fork drifted to torch 2.0.1 / torchvision 0.15.2
# (an ancient pair the index has no wheel for on this platform). Each floor is the newest
# coherent set that index actually publishes.
cu124 = ["torch>=2.6", "torchaudio>=2.6", "torchvision>=0.21"]
rocm  = ["torch>=2.5,<2.6", "torchaudio>=2.5,<2.6", "torchvision>=0.20,<0.21",
         "pytorch-triton-rocm"]   # ROCm-only transitive dep of torch; the index is
                                  # explicit=true, so it must be mapped or uv looks on PyPI
cpu   = ["torch>=2.6", "torchaudio>=2.6", "torchvision>=0.21"]

# Image VAE (LiteVAE) preprocessing + image-synthesis eval. Not needed for the
# voice/SMG/world path. torchvision here resolves from the cu124 index too.
# NOTE: image-VAE preprocessing also needs `olvae` (open-litevae), which is a
# local, manually-packaged checkout with no reproducible source yet — install it
# separately where you have it: `uv pip install -e ../open-litevae`. It is kept
# OUT of the deps so a fresh node without that checkout can `uv sync` (a local
# path source is validated even when the extra is unselected, which breaks sync).
image = [
    "accelerate>=0.17",   # eval_zimage_adapter offloads the Z-Image stack
    # torchvision is supplied by the accelerator extra (cu124/rocm/cpu) so its wheel
    # matches torch's; listing it here too would let the two disagree.
    # diffusers is ALSO in the `training` group, but it belongs here too: rendering the
    # adapter's predicted conditioning through frozen SDXL / Z-Image IS image-synthesis eval,
    # and an inference-only node syncing with --no-default-groups otherwise gets everything
    # except the one import multimodal_chat needs (ModuleNotFoundError: diffusers).
    "diffusers>=0.39",
    "pillow",
    "lpips",
    "open-clip-torch",
    "torchmetrics",
    "omegaconf",
]
# Gradio eval demos (voice_clone, etc.).
demo = [
    # accelerate: the Z-Image render path calls enable_model_cpu_offload(), which needs
    # accelerate>=0.17. It was previously only in the `training` group, so a demo-only
    # install crashed at pipeline setup.
    "accelerate>=0.17",
    "gradio",
]

[project.urls]
Repository = "https://github.com/Mekadrom/megatransformer"

# ---------------------------------------------------------------------------
# uv-specific config (IGNORED by pip — a downstream `pip install megatransformer`
# never sees any of this, so the library stays installable in non-uv venvs).
# ---------------------------------------------------------------------------

# Training-node deps. PEP 735 dependency-groups are LOCAL-only (never published
# in the wheel metadata), so torch et al. reach the training node via `uv sync`
# but are invisible to a downstream `pip install megatransformer`.
[dependency-groups]
training = [
    "torch",
    "torchaudio",
    "accelerate",
    "datasets>=5,<6",   # 5.x: fixes the Arrow-parquet-over-HTTP silent image corruption
                        # (loading scripts + trust_remote_code removed; Audio decode now via
                        # torchcodec, which we sidestep with soundfile — see decode_audio)
    "tensorboard",
    "wandb",
    "jiwer",
    "openai-whisper",
    "vocos",  # 24kHz mel->wave vocoder for world/SMG visualization (pulls encodec)
    "scikit-learn",
    "psutil",
    "requests",
    "diffusers>=0.39",   # frozen SDXL / Z-Image-Turbo image decoders (adapter render + eval)
    "bitsandbytes",      # 4-bit Qwen3-4B target encoder for the Z-Image adapter (fits alongside training)
]
dev = [
    "pytest",
]
deepspeed = [
    "deepspeed"
]

[tool.uv]
# `uv sync` installs these groups by default (the full training environment).
default-groups = ["training", "dev", "deepspeed"]

# pyctcdecode (0.5.0, unmaintained since 2022) declares numpy<2.0.0, which would pin the
# whole graph to numpy 1.26 even though the rest of the stack (and pyctcdecode itself, in
# practice) works fine on numpy 2. Override it so the lock matches the numpy-2.x env we run.
override-dependencies = ["numpy>=2"]

# Exactly one accelerator extra may be active; uv resolves a separate branch per extra.
conflicts = [[{ extra = "cu124" }, { extra = "rocm" }, { extra = "cpu" }]]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Keyed on the accelerator extra so the same lock serves CUDA, ROCm and CPU nodes.
# WITHOUT the extra keys these were unconditional, which is why `uv sync
# --no-default-groups` still dragged in nvidia-cublas-cu12 et al on a ROCm box:
# torch is a TRANSITIVE requirement (speechbrain / torchcrepe /
# rotary-embedding-torch), so omitting it from [dependencies] does not avoid it.
torch = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-rocm",  extra = "rocm" },
    { index = "pytorch-cpu",   extra = "cpu" },
]
torchaudio = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-rocm",  extra = "rocm" },
    { index = "pytorch-cpu",   extra = "cpu" },
]
torchvision = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-rocm",  extra = "rocm" },
    { index = "pytorch-cpu",   extra = "cpu" },
]
pytorch-triton-rocm = { index = "pytorch-rocm", extra = "rocm" }
# open-litevae (olvae) is intentionally NOT declared here: it's a local,
# manually-packaged checkout, and a path source is validated on every `uv sync`
# even on nodes that don't have it (breaking sync). Install it manually where
# needed (`uv pip install -e ../open-litevae`); once forked+pushed, add it back
# as a git source in the [image] extra to make image-VAE preprocessing reproducible.

# src-layout: the importable package `megatransformer` lives under src/.
# `pip install -e .` (or `uv sync`) then makes `import megatransformer.model.smg.smg` work.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["megatransformer*"]
